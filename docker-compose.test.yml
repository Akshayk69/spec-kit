version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: python:3.10-slim
    working_dir: /mlflow
    volumes:
      - ./mlflow-data:/mlflow
    ports:
      - "5000:5000"
    command: >
      bash -c "pip install --no-cache-dir 'mlflow[extras]==2.6.1' && \
               mkdir -p /mlflow && \
               mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db \
                             --default-artifact-root /mlflow/artifacts \
                             --host 0.0.0.0 --port 5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/2.0/mlflow/versions"]
      interval: 10s
      timeout: 5s
      retries: 6
